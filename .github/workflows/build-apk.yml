name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*-super-agent']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project
        env:
          PROFILE: production
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No release APK was produced." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            test -s "$apk"
            sha256sum "$apk"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CherryStudio-SuperAgent-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" android/app/build/outputs/apk/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cherry Studio Mobile Super Agent $TAG_NAME" \
            --generate-notes
